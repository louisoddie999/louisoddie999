<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion Reel</title>
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('fonts/archivo.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('fonts/jetbrains-mono.woff2') format('woff2');
        font-weight: 100 800;
      }
      html, body { margin: 0; height: 100%; background: #0c0c0f; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
      #play {
        position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
        color: #f2ede4; font: 500 14px 'JetBrains Mono', monospace; letter-spacing: 3px;
      }
      body.capture #play, body.playing #play { display: none; }
    </style>
  </head>
  <body>
    <canvas id="reel" width="1920" height="1080"></canvas>
    <div id="play">CLICK TO PLAY ▶</div>
    <script src="timeline.js"></script>
    <script src="reel.js"></script>
    <script>
      // ?capture → deterministic frame-by-frame rendering driven by render.js.
      // Otherwise → a live, real-time player (single sample per frame) synced to the soundtrack.
      const capture = new URLSearchParams(location.search).has('capture');
      if (capture) document.body.classList.add('capture');
      REEL.init(document.getElementById('reel')).then(() => {
        if (capture) return (window.READY = true);
        REEL.drawTime(0, { subframes: 1 });
        const audio = new Audio('out/reel.wav');
        document.getElementById('play').onclick = () => {
          document.body.classList.add('playing');
          audio.currentTime = 0;
          audio.play().catch(() => {});
          const t0 = performance.now();
          const tick = () => {
            const t = audio.paused || audio.ended ? (performance.now() - t0) / 1000 : audio.currentTime;
            REEL.drawTime(Math.min(t, REEL.DURATION - 1 / REEL.FPS), { subframes: 1 });
            if (t < REEL.DURATION) requestAnimationFrame(tick);
            else document.body.classList.remove('playing');
          };
          requestAnimationFrame(tick);
        };
      });
    </script>
  </body>
</html>
